# 编译 Windows 整合包（含简体中文汉化）并发布到 Release。
# 和 packaging/windows/README.md 的本地流程一致：MSYS2 CLANG64 编出 bb-probe.exe /
# bb-gpu-capabilities.exe / bb-play.exe，再用 python.org 的 Python 把启动器冻结成 Uncharted.exe，
# package.sh 组装 dist/uncharted-windows 与 zip。
# 子模块（FSR-Vulkan、imgui、xbyak、magic_enum、miniz、LibAtrac9、Vulkan-Headers）随 checkout 拉取。
name: Build Windows package (Simplified Chinese)

on:
  workflow_dispatch:
    inputs:
      pgo:
        description: "PGO 配置：use = 用仓库里的 pgo/merged.profdata，off = 关闭（编译更快）"
        type: choice
        options:
          - use
          - off
        default: use
      tag:
        description: "Release 标签（留空则用 v<版本>-zh）"
        required: false
        default: ""
      release:
        description: "创建 / 更新 GitHub Release"
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: windows-package
  cancel-in-progress: false

jobs:
  build:
    name: 构建并打包
    runs-on: windows-latest
    timeout-minutes: 340
    steps:
      - name: 检出代码（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 安装 MSYS2 CLANG64 工具链
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git patch gawk diffutils
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-llvm-tools
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross
            mingw-w64-clang-x86_64-protobuf
            mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-miniupnpc
            mingw-w64-clang-x86_64-nlohmann-json

      - name: 准备 python.org 的 Windows Python（冻结启动器用）
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: 编译 C++ 运行时
        shell: msys2 {0}
        env:
          BB_PGO: ${{ github.event.inputs.pgo }}
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -x
          uname -a
          pwd
          echo "MSYS2_ROOT=${MSYS2_ROOT:-unset}"
          echo "PATH=$PATH"
          ls -l /usr/bin/bash* 2>&1 | head -5
          command -v bash || true
          /usr/bin/bash --version 2>&1 | head -1 || true
          ls -l build.sh msys2-env.sh packaging/windows/package.sh
          # 防止 actions/checkout 在 Windows 上把脚本转成 CRLF（会让 bash 报 127 / bad interpreter）
          ls -d /c/msys64 >/dev/null 2>&1 && echo "警告：/c/msys64 存在（旧 MSYS2）" || echo "no /c/msys64"
          for t in awk gawk clang clang++ llvm-profdata llvm-strip cmp; do command -v "$t" >/dev/null && echo "ok  $t -> $(command -v $t)" || echo "MISSING $t"; done
          echo '#include <version>' | clang++ -x c++ -dM -E - 2>&1 | grep -m1 _LIBCPP_VERSION || echo "libc++ probe failed"
          sed -i 's/\r$//' build.sh msys2-env.sh packaging/windows/package.sh
          mkdir -p out
          set -o pipefail
          /usr/bin/bash -x build.sh 2>&1 | tee out/build-stdout.log

      - name: 冻结启动器并打包
        shell: msys2 {0}
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          sed -i 's/\r$//' packaging/windows/package.sh
          export WINPYTHON="$(cygpath -m "$pythonLocation")/python.exe"
          echo "Python: $WINPYTHON"
          ls -l "$WINPYTHON"
          echo "fonts=[$(cygpath -w "$PWD/launcher/fonts")]"
          ls -d launcher/fonts launcher/covers
          mkdir -p out
          # launcher/uncharted.png 被 .gitignore 忽略，需先用 Pillow 画出来
          "$WINPYTHON" -m pip install -q --disable-pip-version-check pillow
          "$WINPYTHON" packaging/windows/make_uncharted_icon.py launcher/uncharted.ico launcher/uncharted.png
          ls -l launcher/uncharted.png
          /usr/bin/bash -x packaging/windows/package.sh 2>&1 | tee out/package-stdout.log

      - name: 读取版本号
        id: version
        shell: bash
        run: |
          v=$(sed -n "s/^VERSION = '\([0-9.]*\)'/\1/p" launcher/uncharted_launcher.py || true)
          echo "value=${v:-0.0.0}" >> "$GITHUB_OUTPUT"

      - name: 重命名 zip
        shell: bash
        run: cp dist/uncharted-windows.zip "dist/uncharted-windows-${{ steps.version.outputs.value }}-zh.zip"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: uncharted-windows-${{ steps.version.outputs.value }}-zh
          path: dist/uncharted-windows-*.zip
          retention-days: 14
          if-no-files-found: error

      - name: 发布到 Release
        if: github.event_name == 'push' || inputs.release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || format('v{0}-zh', steps.version.outputs.value) }}
          target_commitish: ${{ github.sha }}
          name: 神秘海域 合集 PC ${{ steps.version.outputs.value }} · 简体中文
          body: |
            Uncharted: The Nathan Drake Collection 的 Windows 原生移植（SuperMedo 的 uncharted_pc）
            整合包，**启动器带简体中文界面**。

            ### 本版包含
            - Uncharted.exe（启动器，界面语言可切「简体中文」；自动识别中文 Windows）
            - Play Uncharted.exe、bb-probe.exe、bb-gpu-capabilities.exe 与所需 DLL
            - 三部作品共用一个启动器：Drake's Fortune / Among Thieves / Drake's Deception

            ### 中文相关
            - 高级页 → 界面语言 → 简体中文（或保留「自动」）
            - 游戏内语言在「游戏」页的「语言」里选简体中文 / 繁体中文（取决于你的合集 dump 是否带中文资源）
            - 章节标题等原来用 Cinzel 字体的位置已改用微软雅黑，避免方框

            ### 注意
            - 不包含任何游戏文件：需要你自己从 PS4 主机解密导出的合集（CUSA02343、CUSA02320 …），
              目录里要有 eboot.bin、big2-ps4_Shipping.elf、big3-ps4_Shipping.elf、sce_sys、u1data、u2data、u3data
            - 显卡需要 Vulkan 1.3 与 6 GB 以上显存
            - 社区逆向项目，与 Sony Interactive Entertainment、Naughty Dog 无关；本包由
              langcunfu/uncharted_pc 自动编译，上游更新请参考 Supermedo/uncharted_pc
          files: dist/uncharted-windows-*.zip
          fail_on_unmatched_files: true
          generate_release_notes: false
